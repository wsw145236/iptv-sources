name: update script

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
  
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - run: pnpm build:static
      - name: Compress EPG XML
        run: |
          # 检查文件是否存在，如果存在则进行最高级别压缩
          if [ -f "public/epg/epg_pw.xml" ]; then
            echo "🔄 Compressing epg_pw.xml..."
            gzip -9 -k public/epg/epg_pw.xml
            # 可选：如果你想删除原文件以节省空间，取消下一行的注释
            # rm public/epg/epg_pw.xml
          else
            echo "⚠️ epg_pw.xml not found, skipping compression."
          fi

